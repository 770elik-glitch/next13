<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>NEXT13 · המשחק</title><link rel="icon" href="/favicon.png">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(160deg,#001C5E,#003393 60%,#005CD5);color:#fff;padding:20px}
.box{width:100%;max-width:380px;text-align:center}img{width:120px;height:120px;border-radius:50%;background:#fff;margin-bottom:16px}
h1{margin:0 0 6px;font-size:28px}p{margin:0 0 22px;color:#E3EFFC}input{width:100%;font-size:26px;text-align:center;letter-spacing:6px;padding:14px;border-radius:14px;border:0;margin-bottom:12px;color:#001C5E}
button{width:100%;font-size:20px;font-weight:700;padding:14px;border:0;border-radius:14px;background:#FECF57;color:#001C5E;cursor:pointer}#err{min-height:24px;margin-top:12px;color:#FECF57}</style></head>
<body><div class="box"><img src="/favicon.png" alt="NEXT13"><h1>מסע הבר מצווה שלך</h1><p>הקלד את הקוד האישי שקיבלת</p>
<form id="f"><input id="c" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="•••••" required><button>כניסה למשחק</button></form><div id="err"></div></div>
<script src="codes.js"></script><script>const H=window.NEXT13_CODES||[];
try{if(H.includes(localStorage.getItem("next13-access")))location.replace("play.html")}catch(e){}
async function h(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("next13:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
f.onsubmit=async e=>{e.preventDefault();const v=c.value.trim();if(H.includes(await h(v))){try{localStorage.setItem("next13-access",await h(v))}catch(e){}location.replace("play.html")}else{err.textContent="הקוד לא נכון. נסה שוב.";c.select()}}</script></body></html>
